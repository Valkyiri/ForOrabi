<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FastAPI Docs Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1e293b;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #34d399;
      --warn: #fbbf24;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0b1220, #111827);
      color: var(--text);
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    p.lead { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
    .composer, .result, .status {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button, .ghost {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
    }
    button.primary { background: var(--accent); color: #082f49; font-weight: 700; }
    button.primary:disabled { opacity: 0.6; cursor: wait; }
    .ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .chip.ok { color: var(--ok); border-color: #065f46; }
    .chip.warn { color: var(--warn); border-color: #854d0e; }
    .answer {
      white-space: pre-wrap;
      line-height: 1.5;
      background: var(--panel);
      border-radius: 8px;
      padding: 12px;
    }
    ul { padding-left: 18px; }
    a { color: var(--accent); }
    .hidden { display: none; }
    footer { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>FastAPI Documentation Assistant</h1>
    <p class="lead">
      Ask a question about the official FastAPI docs. The backend routes the question,
      retrieves documentation chunks, answers from those chunks, then verifies the answer.
    </p>

    <section class="composer">
      <label for="question">Your question</label>
      <textarea id="question" maxlength="2000" placeholder="How do I create a POST endpoint in FastAPI?"></textarea>
      <div class="actions">
        <button class="primary" id="ask" type="button">Ask</button>
        <button class="ghost" type="button" data-example="How do I create a POST endpoint in FastAPI?">POST endpoint</button>
        <button class="ghost" type="button" data-example="How does Depends work?">Depends</button>
        <button class="ghost" type="button" data-example="Summarize the FastAPI middleware documentation.">Summarize middleware</button>
      </div>
    </section>

    <p class="status hidden" id="status"></p>
    <section class="result hidden" id="result">
      <div class="meta" id="meta"></div>
      <div class="answer" id="answer"></div>
      <h2>Sources</h2>
      <ul id="sources"></ul>
      <h2>Verification</h2>
      <p id="verification"></p>
    </section>

    <footer>
      API docs stay available at <a href="/docs">/docs</a>.
    </footer>
  </main>
  <script>
    const question = document.getElementById("question");
    const ask = document.getElementById("ask");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const meta = document.getElementById("meta");
    const answer = document.getElementById("answer");
    const sources = document.getElementById("sources");
    const verification = document.getElementById("verification");

    document.querySelectorAll("[data-example]").forEach((button) => {
      button.addEventListener("click", () => {
        question.value = button.dataset.example;
        question.focus();
      });
    });

    ask.addEventListener("click", submit);
    question.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        submit();
      }
    });

    async function submit() {
      const text = question.value.trim();
      if (text.length < 3) {
        showStatus("Type a question with at least 3 characters.");
        return;
      }
      ask.disabled = true;
      result.classList.add("hidden");
      showStatus("Asking the multi-agent workflow. This can take up to a minute...");
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: text }),
        });
        const data = await response.json();
        if (!response.ok) {
          const detail = Array.isArray(data.detail)
            ? data.detail.map((item) => item.msg || item).join(" ")
            : data.detail;
          throw new Error(detail || "The request failed.");
        }
        render(data);
        status.classList.add("hidden");
      } catch (error) {
        showStatus(error.message);
      } finally {
        ask.disabled = false;
      }
    }

    function showStatus(message) {
      status.textContent = message;
      status.classList.remove("hidden");
    }

    function render(data) {
      const supported = data.verification && data.verification.supported;
      meta.innerHTML = "";
      [
        ["Intent", data.intent],
        ["Agent", data.agent],
        ["Verification", supported ? "supported" : "not fully verified"],
      ].forEach(([label, value]) => {
        const chip = document.createElement("span");
        chip.className = "chip" + (label === "Verification" ? (supported ? " ok" : " warn") : "");
        chip.textContent = label + ": " + value;
        meta.appendChild(chip);
      });
      answer.textContent = data.answer || "";
      sources.innerHTML = "";
      (data.sources || []).forEach((source) => {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.href = source.url;
        link.target = "_blank";
        link.rel = "noreferrer";
        link.textContent = source.title + " — " + source.section;
        item.appendChild(link);
        sources.appendChild(item);
      });
      if (!sources.children.length) {
        sources.innerHTML = "<li>No sources were retrieved.</li>";
      }
      const extra = (data.verification && data.verification.explanation) || "";
      verification.textContent = extra;
      result.classList.remove("hidden");
    }
  </script>
</body>
</html>
